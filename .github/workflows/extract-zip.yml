
name: Extract Falco ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -name "falco-offline-starter.zip" \
            -type f -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/falco-extracted
          unzip -q "$ZIP" -d /tmp/falco-extracted

          if [ -d /tmp/falco-extracted/falco-offline-starter ]; then
            SOURCE=/tmp/falco-extracted/falco-offline-starter
          else
            SOURCE=/tmp/falco-extracted
          fi

          cp -a "$SOURCE"/. .

          echo "Extracted files:"
          ls -la
          find .github -type f 2>/dev/null || true

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && exit 0

          git commit -m "Extract Falco offline starter"
          git push
